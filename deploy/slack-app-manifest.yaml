# Slack app for US Outbound, named Columbus (Harry, 2 Oct 2026; SPEC 3, 11, 14 phase 0). Create it at api.slack.com/apps →
# "From an app manifest", install it to the workspace, invite the bot to #us-outbound and
# #us-outbound-dev, and put the bot token (xoxb-…) in the sealed Railway variable
# US_OUTBOUND_SLACK_BOT_TOKEN (docs/railway-setup.md). There is no public endpoint
# (SPEC 2): no events, no interactivity, no slash commands. The jobs post with chat:write
# and poll thread replies and reactions for approvals (poll_approvals, every 5 minutes), and
# DM the approvers when an item escalates and Instantly's forward endpoint is missing.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Columbus
  description: Alerts, approvals and readouts for Spill's US outbound engine.
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: columbus
    always_online: false
  app_home:
    messages_tab_enabled: true  # escalation DMs to the approvers (PHASE0-CONFIRM: posting by user id lands here)
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - chat:write        # alerts, the daily post, the Monday readout, thread confirmations
      - channels:history  # read Harry's thread replies (approvals) in public channels
      - groups:history    # ... and in private channels
      - channels:read     # resolve #us-outbound to its id
      - groups:read       # ... when the channel is private
      - users:read        # names for approver ids in confirmations
      - reactions:read    # ✅ / ❌ on an alert's draft (poll_approvals; decision D11)
      - im:write          # escalation DMs to the approvers on approver_slack_ids
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
