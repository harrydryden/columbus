[project]
name = "us-outbound"
version = "0.1.0"
description = "Spill's account-based US outbound engine (see SPEC.md)"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "google-auth>=2.30",
  "google-cloud-bigquery>=3.25",
  "google-cloud-secret-manager>=2.20",
  "anthropic>=1.0",
  "tldextract>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "sqlglot>=25"]

[project.scripts]
us-outbound = "us_outbound.ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["us_outbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
